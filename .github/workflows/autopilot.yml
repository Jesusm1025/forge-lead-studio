name: Forge Lead Studio — 24/7 Cloud AutoPilot

on:
  schedule:
    # 09:00 AM AST (UTC-4) / 13:00 UTC daily
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forge-lead-studio-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Forge AutoPilot (KV Telemetry + IMAP Brake + Follow-Ups)
        env:
          SENDER_CREDENTIALS_JSON: ${{ secrets.SENDER_CREDENTIALS_JSON }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TELEMETRY_ADMIN_KEY: ${{ secrets.TELEMETRY_ADMIN_KEY }}
          TELEMETRY_WORKER_URL: ${{ secrets.TELEMETRY_WORKER_URL }}
          SENDER_NAME: ${{ secrets.SENDER_NAME }}
          SENDER_PHYSICAL_ADDRESS: ${{ secrets.SENDER_PHYSICAL_ADDRESS }}
        run: python scripts/auto_pilot.py --live

      - name: Sync CRM & Niche Intelligence ledgers to public dashboard bundle
        run: |
          mkdir -p public/tracking
          cp tracking/crm_pipeline.json public/tracking/crm_pipeline.json
          if [ -f tracking/niche_intelligence.json ]; then
            cp tracking/niche_intelligence.json public/tracking/niche_intelligence.json
          fi

      - name: Auto-Redeploy Protected Executive Dashboard (Cloudflare Pages Direct API)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TELEMETRY_ADMIN_KEY: ${{ secrets.TELEMETRY_ADMIN_KEY }}
          SENDER_CREDENTIALS_JSON: ${{ secrets.SENDER_CREDENTIALS_JSON }}
        run: |
          if [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] && [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            python scripts/deploy_pages_api.py --deploy-dashboard
          else
            echo "CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN not configured — skipping dashboard redeploy."
          fi

      - name: Commit and push updated CRM, Niche Intelligence & autopilot log
        run: |
          git config user.name "Forge AutoPilot Bot"
          git config user.email "forge-autopilot-bot@users.noreply.github.com"
          git add tracking/crm_pipeline.json public/tracking/crm_pipeline.json tracking/niche_intelligence.json public/tracking/niche_intelligence.json tracking/autopilot.log
          if ! git diff --cached --quiet; then
            git commit -m "chore(autopilot): daily sync + Agent 00 niche intel [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push
          else
            echo "No CRM, niche intelligence, or autopilot log changes to commit."
          fi
